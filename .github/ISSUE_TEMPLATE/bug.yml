name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: Include steps to reproduce.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What did you expect?}
  - type: input
    id: version
    attributes: {label: Version and OS, placeholder: "penzene 0.1.0, macOS 15"}
