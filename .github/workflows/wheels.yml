name: Wheels

permissions:
  contents: write

# Self-contained Python wheels: built against the pixi env, then repaired so
# RDKit and Qt ship inside, then tested in a clean venv with the env hidden.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/wheels.yml', 'pyproject.toml', 'python/**', 'CMakeLists.txt', 'cmake/bundle-libstdcxx.py', 'cmake/build-rdkit.sh', 'cmake/check-no-chemdraw.sh']

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, name: linux-x86_64}
          - {os: macos-14, name: macos-arm64}
          - {os: macos-15-intel, name: macos-x86_64}
          - {os: windows-2022, name: windows-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150   # 60 once RDKit comes from the cache
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with: {cache: true}
      # RDKit without its ChemDraw library (#233); see rdkit.yml.
      - uses: actions/cache@v4
        id: rdkit
        with:
          path: rdkit-prefix
          key: rdkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/build-rdkit.sh', 'pixi.lock') }}
      - if: steps.rdkit.outputs.cache-hit != 'true'
        shell: bash
        run: pixi run bash cmake/build-rdkit.sh rdkit-prefix
      - shell: bash
        run: echo "RDKit_ROOT=$(pwd -W 2>/dev/null || pwd)/rdkit-prefix" >> "$GITHUB_ENV"  # Git bash: D:/a/...
      - run: pixi run wheel -v   # shows CMake's "RDKit:" line
      - name: Repair (Linux)
        if: runner.os == 'Linux'
        run: |
          pixi run python -m pip install -q auditwheel patchelf wheel
          export LD_LIBRARY_PATH=$PWD/rdkit-prefix/lib:$PWD/.pixi/envs/default/lib
          # Our RDKit's libraries carry conda's lib in their RPATH, which outranks LD_LIBRARY_PATH:
          # hide the env's RDKit while auditwheel looks, or it bundles that one, ChemDraw and all (#233).
          mkdir conda-rdkit && mv .pixi/envs/default/lib/libRDKit* conda-rdkit/
          trap 'mv conda-rdkit/* .pixi/envs/default/lib/' EXIT
          pixi run auditwheel repair -w repaired dist/*.whl
          # Bundle libstdc++ privately so the wheel runs on glibc 2.28-era systems (#122).
          pixi run python cmake/bundle-libstdcxx.py repaired/*.whl "$PWD/.pixi/envs/default/lib" wheelhouse
          pixi run auditwheel show wheelhouse/*.whl
      - name: Repair (macOS)
        if: runner.os == 'macOS'
        run: |
          pixi run python -m pip install -q delocate
          # The module and the Qt plugin find conda's libs via @rpath; show delocate where.
          export DYLD_LIBRARY_PATH=$PWD/rdkit-prefix/lib:$PWD/.pixi/envs/default/lib
          pixi run delocate-wheel -w wheelhouse -v dist/*.whl
      - name: Repair (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pixi run python -m pip install -q delvewheel
          # No mangling: the offscreen plugin must find the same Qt DLLs by name.
          pixi run delvewheel repair --no-mangle-all -w wheelhouse --add-path "$(pwd -W)/rdkit-prefix/lib;$(pwd -W)/.pixi/envs/default/Library/bin" dist/*.whl
      - run: ls -la wheelhouse
        shell: bash
      - name: No RDKit ChemDraw library (#233)
        shell: bash
        run: |
          mkdir unpacked && for w in wheelhouse/*.whl; do python -m zipfile -e "$w" unpacked/; done
          bash cmake/check-no-chemdraw.sh unpacked
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Test in a clean venv, without the build env
        shell: bash
        run: |
          mv .pixi .pixi-hidden
          python -m venv venv
          if [ "$RUNNER_OS" = Windows ]; then PY="$PWD/venv/Scripts/python.exe"; else PY="$PWD/venv/bin/python"; fi
          $PY -m pip install -q wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          # A lone O has no bonds, so any path in its SVG is a glyph: fonts must work.
          $PY -c "import penzene as pz; d = pz.Document(); d.add_atom('O'); s = d.to_svg(); assert '<path' in s, s[:2000]; print('glyphs ok')"
          PENZENE_TEST_DATA="$GITHUB_WORKSPACE/tests/data" $PY "$GITHUB_WORKSPACE/tests/test_python.py"
      - uses: actions/upload-artifact@v4
        with: {name: 'wheel-${{ matrix.name }}', path: wheelhouse/*.whl}

  # The Linux wheel on older systems: Ubuntu 22.04 (Google Colab) and a
  # manylinux_2_28 container (RHEL 8-era, like many HPC clusters).
  linux-compat:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, container: ''}
          - {os: ubuntu-24.04, container: 'quay.io/pypa/manylinux_2_28_x86_64'}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: {name: wheel-linux-x86_64, path: wheelhouse}
      - uses: actions/setup-python@v5  # Ubuntu 22.04's own python3 is 3.10; the wheel needs 3.12+
        if: matrix.container == ''
        with: {python-version: '3.12'}
      - name: Install and test
        shell: bash
        run: |
          PY=$(command -v /opt/python/cp312-cp312/bin/python || command -v python)
          $PY -m venv venv && . venv/bin/activate
          python -m pip install -q wheelhouse/*.whl
          cd /tmp
          PENZENE_TEST_DATA="$GITHUB_WORKSPACE/tests/data" python "$GITHUB_WORKSPACE/tests/test_python.py"

  # Tagged releases carry the wheels (pip install <url>) until PyPI publishing is set up (#78).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheel, linux-compat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'wheel-*', merge-multiple: true, path: wheelhouse}
      - run: |
          # Both workflows get here on a tag; whichever is second finds the release made.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes 2>/dev/null ||
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber wheelhouse/*.whl
        env: {GH_TOKEN: '${{ github.token }}'}

  # Trusted publishing (no tokens): TestPyPI from a manual run, PyPI from a tag.
  # Both publishers are registered for workflow wheels.yml, environment "pypi".
  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [wheel, linux-compat]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'wheel-*', merge-multiple: true, path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {repository-url: 'https://test.pypi.org/legacy/', skip-existing: true}

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel, linux-compat]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'wheel-*', merge-multiple: true, path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1
