[workspace]
name = "penzene"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
librdkit-dev = ">=2025.9,<2027"  # RDKit C++ headers + libs
libboost-devel = "*"             # RDKit public headers include Boost
qt6-main = ">=6.8,<7"            # Widgets, Svg, PDF
catch2 = ">=3.5,<4"
jsonschema = ">=4"              # tests: .penz files against docs/_static/penz.schema.json
expat = ">=2.5"                  # XML parsing for the vendored ChemDraw file library
zlib = "*"                       # headers for building RDKit without ChemDraw (#233)
cmake = ">=3.28"
ninja = "*"
python = ">=3.12,<3.14"          # Python module (abi3: one build serves 3.12+)
nanobind = ">=2.4"
scikit-build-core = ">=0.10"
pip = "*"

[target.linux-64.dependencies]
cxx-compiler = "*"               # conda gcc: conda libs need a newer libstdc++ than older distros ship

[target.win-64.dependencies]
vs2022_win-64 = "*"              # activates MSVC for Ninja

[tasks]
configure = "cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DPENZENE_PYTHON=ON"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"], env = { QT_QPA_PLATFORM = "offscreen" } }

# The Python wheel, built against this environment's RDKit and Qt (not yet self-contained, see #77).
wheel = "python -m pip wheel . --no-build-isolation --no-deps -w dist"

# Type stubs for the Python module, from its docstrings (tests/test_python.py checks they're current).
stubs = { cmd = "python -m nanobind.stubgen -m penzene._penzene -o python/penzene/_penzene.pyi", env = { PYTHONPATH = "build/python", QT_QPA_PLATFORM = "offscreen" }, depends-on = ["build"] }

[target.unix.tasks]
run = { cmd = "build/bin/penzene", depends-on = ["build"] }
# Collects the interface strings into a translation: pixi run lupdate -ts translations/penzene_de.ts
lupdate = "lupdate6 src -locations none"

[target.osx.tasks]
run = { cmd = "build/bin/penzene.app/Contents/MacOS/penzene", depends-on = ["build"] }
# Self-contained app in ~/Applications, for trying it out locally.
install-app = { cmd = """
rm -rf build/deploy && mkdir -p build/deploy && cp -R build/bin/penzene.app build/deploy/ &&
macdeployqt6 build/deploy/penzene.app -libpath="$CONDA_PREFIX/lib" 2>/dev/null ;
codesign --force --deep --sign - build/deploy/penzene.app &&
mkdir -p ~/Applications && rm -rf ~/Applications/"Penzene.app" &&
cp -R build/deploy/penzene.app ~/Applications/"Penzene.app" && echo "Installed ~/Applications/Penzene.app"
""", depends-on = ["build"] }

[target.win.tasks]
run = { cmd = "build/bin/penzene.exe", depends-on = ["build"] }
lupdate = "lupdate src -locations none"
