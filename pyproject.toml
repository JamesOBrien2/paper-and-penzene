[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "penzene"
dynamic = ["version"]
description = "Publication-quality 2D chemical structures from Python: the Penzene drawing engine"
readme = "python/README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["chemistry", "cheminformatics", "chemdraw", "structure", "drawing", "rdkit", "svg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.urls]
Homepage = "https://github.com/JamesOBrien2/penzene"
Issues = "https://github.com/JamesOBrien2/penzene/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/wheel"
cmake.build-type = "Release"
wheel.packages = ["python/penzene"]
wheel.py-api = "cp312"   # nanobind stable ABI: one wheel serves Python 3.12+
sdist.exclude = [".pixi", "build", "dist", "docs"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(penzene VERSION (?P<value>[0-9.]+)'
