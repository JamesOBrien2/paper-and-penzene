<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Paper & Penzene: a dog-eared sheet with a hand-inked benzene and a pencil -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#7287fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1e2e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- paper, slightly tilted, top-right corner folded -->
  <g transform="rotate(-6 256 262)" filter="url(#shadow)">
    <path d="M118 92 H334 L398 156 V430 H118 Z" fill="#fdf6e3"/>
    <path d="M334 92 V156 H398 Z" fill="#e6dcc0"/>
    <!-- ruled lines -->
    <g stroke="#cfe0f5" stroke-width="4">
      <line x1="140" y1="372" x2="376" y2="372"/>
      <line x1="140" y1="402" x2="376" y2="402"/>
    </g>
    <line x1="150" y1="104" x2="150" y2="420" stroke="#f5b8c4" stroke-width="4"/>
  </g>

  <!-- benzene, inked with a slightly wobbly hand -->
  <g fill="none" stroke="#1e1e2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="15">
    <path d="M250 136 Q292 158 322 178 Q324 222 321 262 Q286 283 250 302 Q213 283 178 262 Q176 220 178 178 Q212 157 250 136 Z"/>
    <!-- Kekulé double bonds on alternate edges -->
    <path d="M254 164 Q280 177 298 190"/>
    <path d="M296 246 Q275 259 254 272"/>
    <path d="M203 245 Q201 220 203 194"/>
  </g>

  <!-- pencil resting on the page, tip at the last vertex it drew -->
  <g transform="translate(330 262) rotate(38)">
    <rect x="0" y="-15" width="150" height="30" fill="#f9e2af"/>
    <rect x="0" y="-15" width="150" height="10" fill="#fab387"/>
    <rect x="150" y="-15" width="18" height="30" fill="#a6adc8"/>
    <rect x="168" y="-15" width="26" height="30" rx="7" fill="#f38ba8"/>
    <path d="M0 -15 L-38 0 L0 15 Z" fill="#f5e0c3"/>
    <path d="M-26 -5 L-38 0 L-26 5 Z" fill="#1e1e2e"/>
  </g>
</svg>
